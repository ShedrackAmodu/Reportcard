{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - School Management System</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/pwa-enhancements.css' %}">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <h3 class="mb-3">You are offline</h3>
                        <p class="text-muted mb-4">
                            Some data-entry and reports may not be available until your internet connection is restored.
                        </p>
                        <button class="btn btn-primary" onclick="window.location.reload();">Try Again</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
